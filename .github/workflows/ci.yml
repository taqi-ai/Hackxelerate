name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer push cancels the older run on the same ref: fast feedback, no wasted minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Decide what changed, so docs-only or ML-only pushes skip the other jobs entirely.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      web: ${{ steps.f.outputs.web }}
      ml: ${{ steps.f.outputs.ml }}
      db: ${{ steps.f.outputs.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            db:
              - 'supabase/**'
              - '.github/workflows/ci.yml'
            ml:
              - 'services/ml/**'
              - 'data/demo/**'
              - '.github/workflows/ci.yml'

  web-check:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  web-build:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Restore the Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-${{ hashFiles('apps/web/src/**', 'apps/web/next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # public placeholders so the build never depends on secrets
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_ML_API_URL: http://localhost:8000

  ml-tests:
    needs: changes
    if: needs.changes.outputs.ml == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/ml/requirements.txt
          python-version: "3.12"
      # uv resolves and installs the wheels several times faster than pip
      - run: uv pip install -r services/ml/requirements.txt
      - working-directory: services/ml
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q -x

  # Critical user journeys in a real browser against the real app in offline mode (frozen synthetic cohort,
  # no secrets). The snapshot is generated from data/demo with --no-publish, so nothing touches a database.
  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.ml == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/ml/requirements.txt
          python-version: "3.12"
      - run: uv pip install -r services/ml/requirements.txt
      - name: Build the offline snapshot (no publish)
        run: '"$GITHUB_WORKSPACE/.venv/bin/python" services/ml/scripts/publish_demo.py --no-publish'
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - working-directory: apps/web
        run: npm ci --no-audit --no-fund --prefer-offline
      - working-directory: apps/web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_ML_API_URL: http://localhost:8000
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - working-directory: apps/web
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }

  # Migrations must apply to an empty database, and row-level security must hold for every role
  # (supabase/tests/rls_isolation.sql: anon, no-profile user, mentor, student, admin; always rolled back).
  db-rls:
    needs: changes
    if: needs.changes.outputs.db == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.121.0 }
      - run: supabase db start
      - run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/rls_seed.sql -f supabase/tests/rls_isolation.sql -f supabase/tests/intervention_rules.sql -f supabase/tests/ingest_tenancy.sql

  # Known-vulnerability gate on what ships. Web: production dependencies, blocks on critical (the two Next.js
  # advisories fixed only in Next 16 are an accepted, tracked risk: docs/engineering/SECURITY_REMEDIATION.md).
  # ML: every pinned requirement, blocks on any known vulnerability.
  deps-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: apps/web
        run: npm audit --omit=dev --audit-level=critical
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit==2.10.1 && pip-audit -r services/ml/requirements.txt --disable-pip --no-deps

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  # One stable name to require in branch protection. Skipped jobs count as success.
  ci-ok:
    if: always()
    needs: [web-check, web-build, ml-tests, db-rls, deps-audit, e2e, secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -qE '"result": "(failure|cancelled)"'; then exit 1; fi
