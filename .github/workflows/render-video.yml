name: Render video

# Manual: Actions tab -> "Render video" -> Run workflow. Result is downloadable as an artifact.
on:
  workflow_dispatch:
    inputs:
      composition:
        description: Composition id (Intro, Social, ...)
        default: Intro

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - working-directory: motion
        run: |
          npm ci
          npx remotion render ${{ inputs.composition }} out/${{ inputs.composition }}.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.composition }}
          path: motion/out/*.mp4
