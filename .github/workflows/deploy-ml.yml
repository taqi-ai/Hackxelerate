name: Deploy ML service (Azure)

# Deploys services/ml to the ascora-ml web app in the ascora-rg resource group.
# Azure builds the Python dependencies itself (Oryx), which takes several minutes.
on:
  push:
    branches: [main]
    paths:
      - "services/ml/app/**"
      - "services/ml/requirements.txt"
      - ".github/workflows/deploy-ml.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ml
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ml/requirements.txt
      - name: Tests gate the deploy
        working-directory: services/ml
        run: |
          pip install -r requirements.txt
          python -m pytest -q
      - name: Stage the deployment package
        run: |
          mkdir -p stage/services/ml stage/data
          cp services/ml/requirements.txt stage/requirements.txt
          cp -r services/ml/app stage/services/ml/app
          cp -r data/demo stage/data/demo
          mkdir -p stage/services/ml/artifacts
          # model state is regenerated by the pipeline; ship the committed copy if present
          [ -f services/ml/artifacts/state.joblib ] && cp services/ml/artifacts/state.joblib stage/services/ml/artifacts/ || true
          find stage -name "__pycache__" -type d -prune -exec rm -rf {} +
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ascora-ml
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: stage
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://ascora-ml.azurewebsites.net/health || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "health check failed"; exit 1
