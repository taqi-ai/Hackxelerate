name: Deploy ML service (Azure)

# Deploys services/ml to the ascora-ml web app (resource group ascora-rg).
# Fast path: only a ~3 MB code zip is uploaded. Heavy dependencies live on the server in /home/deps and are
# re-installed by startup.sh only when requirements.txt changes (tracked by hash).
on:
  push:
    branches: [main]
    paths:
      - "services/ml/app/**"
      - "services/ml/requirements.txt"
      - "services/ml/startup.sh"
      - "services/ml/artifacts/state.joblib"
      - ".github/workflows/deploy-ml.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ml
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/ml/requirements.txt
          python-version: "3.12"
      - run: uv pip install -r services/ml/requirements.txt
      - name: Tests gate the deploy
        working-directory: services/ml
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q -x
      - name: Stage the code-only package
        run: |
          mkdir -p stage/services/ml/artifacts stage/data
          cp services/ml/requirements.txt services/ml/startup.sh stage/
          cp -r services/ml/app stage/services/ml/app
          cp -r data/demo stage/data/demo
          [ -f services/ml/artifacts/state.joblib ] && cp services/ml/artifacts/state.joblib stage/services/ml/artifacts/ || true
          find stage -name "__pycache__" -type d -prune -exec rm -rf {} +
      - name: Zip the package
        run: cd stage && zip -qr ../ascora-ml.zip . && ls -la ../ascora-ml.zip
      # service principal limited to the ascora-rg resource group (Website Contributor), no publish password
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy
        run: az webapp deploy -g ascora-rg -n ascora-ml --src-path ascora-ml.zip --type zip --clean true --restart true
      - name: Wait until healthy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" https://ascora-ml.azurewebsites.net/health || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "service did not become healthy"; exit 1
